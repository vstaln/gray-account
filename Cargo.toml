[package]
name = "gray-account"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray.alignment.id account login plugin for the gray agent harness"

[lib]
name = "gray_account"
path = "src/lib.rs"

[[bin]]
name = "gray-account"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# check/build/release/publish pipeline for `gray account publish`.
# TODO: repin to the main branch once gray-maker#1 merges.
gray-maker = { git = "https://github.com/vstaln/gray-maker", rev = "a4403911ff81c60e30367d791cd5a4de95df8f5c" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
] }

[profile.release]
strip = true
