[package]
name = "gray-account"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray.alignment.id account + plugin maker for the gray agent harness"

[lib]
name = "gray_account"
path = "src/lib.rs"

[[bin]]
name = "gray-account"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
